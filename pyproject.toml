[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wifimonitor"
version = "2.0.0"
description = "PyQt5 GUI for passive Wi-Fi monitoring, WPA handshake capture, auto-attack pipelines, GPS wardriving, and export"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "scapy>=2.5.0,<3",
    "PyQt5>=5.15.0,<6",
    "openpyxl>=3.1.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0,<9", "ruff>=0.4,<1", "mypy>=1.10,<3", "PyQt5-stubs>=5.15,<6"]

[project.scripts]
wifimonitor = "wifimonitor.app:main"
wifimonitor-cli = "wifimonitor.cli:main"

[tool.setuptools.packages.find]
include = ["wifimonitor*"]

[tool.setuptools.package-data]
wifimonitor = ["ui/styles/*.qss", "ui/web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pyflakes (real issues) + pycodestyle errors/warnings. The opinionated
# modernization rules (UP/I/SIM/…) are intentionally not enabled.
select = ["E", "F", "W"]
ignore = ["E501"]  # long lines are common in tables/IE definitions

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true  # scapy ships no type stubs (PyQt5's come from the PyQt5-stubs dev dependency)
